<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI FAQ Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="bg-grid" aria-hidden="true"></div>

<div class="app-shell">

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <span>MENU</span>
      <button type="button" id="sidebar-close" aria-label="Close menu">✕</button>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-section-label">TOPICS</div>
      <ul class="topics-list" id="topics-list"></ul>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-section-label">HISTORY</div>
      <ul class="history-list" id="history-list">
        <li class="history-empty" id="history-empty">No questions yet — ask something!</li>
      </ul>
    </div>
  </aside>

  <script id="topics-data" type="application/json">{{ topics_json|safe }}</script>

  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <main class="card">

    <button type="button" id="sidebar-toggle" class="sidebar-toggle-btn" aria-label="Show history">
      <svg viewBox="0 0 24 24" width="18" height="18">
        <path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
    </button>

    <header class="card-header">
      <div class="hero-bot" aria-hidden="true">
        <img src="{{ url_for('static', filename='robot.jpeg') }}" alt="AI chatbot robot" class="hero-bot-img">
      </div>
      <h1 class="hero-title">FAQ ASSISTANT</h1>
      <p class="hero-subtitle">Ask me anything about Artificial Intelligence</p>
    </header>

    <section class="chat-window" id="chat-window">
      <div class="msg msg-bot">
        <div class="avatar" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="14" height="14">
            <rect x="4" y="8" width="16" height="12" rx="4" fill="#5eead4"/>
            <rect x="10" y="3" width="4" height="5" rx="1" fill="#5eead4"/>
            <circle cx="9" cy="14" r="1.7" fill="#0b0f19"/>
            <circle cx="15" cy="14" r="1.7" fill="#0b0f19"/>
            <rect x="9" y="17" width="6" height="1.4" rx="0.7" fill="#0b0f19"/>
          </svg>
        </div>
        <div class="bubble-wrap">
          <div class="bubble">👋 Hi! Ask me anything about AI.</div>
        </div>
      </div>
    </section>

    <div class="suggestions" id="suggestions">
      <button class="chip" data-q="What is the difference between AI, Machine Learning, and Deep Learning?">ML vs Deep Learning?</button>
      <button class="chip" data-q="Is AI going to replace human jobs?">Will AI replace jobs?</button>
      <button class="chip" data-q="What is the Turing Test?">What's the Turing Test?</button>
    </div>

    <form class="input-bar" id="chat-form" autocomplete="off">
      <input type="text" id="user-input" placeholder="Type your question…" aria-label="Type your question" />
      <button type="submit" id="send-btn" aria-label="Send">
        <svg viewBox="0 0 24 24" width="18" height="18">
          <path d="M3 11.5L21 3l-7 18-3.5-7.5L3 11.5z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
        </svg>
      </button>
    </form>

    <p class="footnote">Each answer shows which FAQ it matched and how confident the match is.</p>

  </main>
</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
